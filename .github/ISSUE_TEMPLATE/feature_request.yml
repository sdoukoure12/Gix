name: ✨ Feature Request
description: Proposer une nouvelle fonctionnalité pour Gix
title: "[Feature] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire votre idée de fonctionnalité. Essayez d'être aussi précis que possible.

  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      multiple: true
      options:
        - composant:AR
        - composant:satellite
        - composant:backend
        - autre
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problème ou besoin
      description: Quelle est la situation actuelle qui motive cette demande ?
      placeholder: "Exemple : Il n'est pas possible de filtrer les satellites par type."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez la fonctionnalité souhaitée.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Y a-t-il d'autres approches que vous avez considérées ?

  - type: textarea
    id: context
    attributes:
      label: Contexte supplémentaire
      description: Captures, maquettes, liens utiles, etc.
